#vig{background:radial-gradient(ellipse at center,#0000 45%,#000d 100%)}#grain{opacity:.09;mix-blend-mode:overlay}

const woodT=tex((x,w)=>{x.fillStyle='#2a1a10';x.fillRect(0,0,w,w);for(let i=0;i<16;i++){x.fillStyle=`hsl(25,${30+R()*20}%,${9+R()*9}%)`;x.fillRect(i*w/16+1,0,w/16-2,w)}x.strokeStyle='#000a';x.lineWidth=.6;for(let i=0;i<80;i++){x.beginPath();x.moveTo(R()*w,R()*w);x.lineTo(R()*w,R()*w);x.stroke()}},512);woodT.repeat.set(3,3);

const stT=tex((x,w)=>{x.fillStyle='#3a3836';x.fillRect(0,0,w,w);for(let i=0;i<2500;i++){x.fillStyle=`rgba(${R()*60},${R()*60},${R()*60},.25)`;x.fillRect(R()*w,R()*w,R()*4,R()*4)}x.strokeStyle='#0a0a0a';for(let i=0;i<12;i++){x.beginPath();let a=R()*w,b=R()*w;x.moveTo(a,b);for(let j=0;j<6;j++){a+=R()*40-20;b+=R()*40-20;x.lineTo(a,b)}x.stroke()}});stT.repeat.set(2,2);

const cracks=new THREE.Mesh(new THREE.CircleGeometry(8,48),new THREE.MeshBasicMaterial({map:crackT,transparent:true,opacity:0,depthWrite:false}));cracks.rotation.x=-Math.PI/2;cracks.position.set(0,.04,OC.z);scene.add(cracks);
const RN=60,rub=new THREE.InstancedMesh(new THREE.DodecahedronGeometry(1,0),M(0x4a4640),RN),rb=[],rdm=new THREE.Object3D();rub.visible=false;rub.frustumCulled=false;rub.castShadow=true;scene.add(rub);
function scatter(){for(let i=0;i<RN;i++){const a=R()*TAU,r=PR+.2+R()*1.5;rb[i]={p:V(Math.cos(a)*r,.2,OC.z+Math.sin(a)*r),v:V(Math.cos(a)*(3+R()*8),6+R()*9,Math.sin(a)*(3+R()*8)),s:.15+R()*.5,rx:R()*3,ry:R()*3,rest:false}}rub.visible=true}

function awaken(){if(awoke)return;awoke=true;sfx.impact();setTimeout(()=>sfx.impact(),900);tone(45,22,4,.5);S.rumble=1;scatter();say('THE FLOOR IS BREAKING APART!',2400);

// curtains

g.computeVertexNormals();const m=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:col,roughness:.95,side:THREE.DoubleSide,emissive:0x180203}));m.position.set(x,y,z);m.rotation.y=ry;scene.add(m);return m}
const curts=[curtain(44,44,-25,22,-14,Math.PI/2,0x6a0d12,1),curtain(44,44,25,22,-14,-Math.PI/2,0x6a0d12,1),curtain(28,40,-20,20,-30,Math.PI/2+.25,0x4a0a0e,1),curtain(28,40,20,20,-30,-Math.PI/2-.25,0x4a0a0e,1),curtain(70,50,0,25,-48,0,0x2a0508,0),curtain(56,9,0,38,-34,0,0x7a1016,0)];
add(scene,new THREE.BoxGeometry(56,.9,.9),gold,0,33.6,-33.6);
// ---- boss: head, collar, shoulders ----
const boss=new THREE.Group();boss.position.set(0,25,-38);boss.scale.setScalar(9);scene.add(boss);
const white=M(0xe6e1d8,{map:skinT,roughness:.6}),redM=M(0x8a0f0f),amber=new THREE.MeshBasicMaterial({color:0xffc020}),hairM=M(0xc84a10,{roughness:1}),cloth=M(0x8a867c,{roughness:1}),ruf=M(0xb8b0a2,{roughness:1,side:THREE.DoubleSide});
const headG=new THREE.Group();boss.add(headG);add(headG,new THREE.SphereGeometry(.55,32,24),white).scale.set(.92,1.2,.92);
const eyes=[-1,1].map(s=>{const g=new THREE.Group();g.position.set(s*.2,.14,.43);headG.add(g);add(g,new THREE.SphereGeometry(.1,12,10),amber);add(g,new THREE.SphereGeometry(.035,8,8),new THREE.MeshBasicMaterial({color:0x100400}),0,0,.085);
const b=add(headG,new THREE.SphereGeometry(.2,10,8),M(0x9a948e),s*.22,.28,.4);b.scale.set(1.4,.45,.8);b.rotation.z=-s*.3;
add(headG,new THREE.TubeGeometry(new THREE.CatmullRomCurve3([V(s*.2,.3,.47),V(s*.2,.0,.53),V(s*.27,-.2,.47),V(s*.34,-.3,.4)]),16,.013,5),redM);return g});

for(let i=0;i<36;i++){const a=R()*TAU,y=-.1+R()*.8;let x=Math.cos(a)*.6,z=Math.sin(a)*.6;if(z>.25&&Math.abs(x)<.45&&y<.5)z=-z;add(headG,new THREE.SphereGeometry(.16+R()*.14,8,8),hairM,x,y,z)}

// ---- giant hands ----
function makeHand(s,h){const g=new THREE.Group();g.rotation.order='YXZ';g.scale.setScalar(3.2);scene.add(g);const sk=M(0xd9d0c6,{roughness:.55});add(g,new THREE.SphereGeometry(.6,16,12),sk).scale.set(.85,.28,1);const inner=-s;

function loadVoiceBuffers(){
  if(!AC)return;

    const tryPath=i=>{
      if(i>=paths.length)return;
      fetch(paths[i])
        .then(r=>{if(!r.ok)throw new Error();return r.arrayBuffer()})
        .then(ab=>AC.decodeAudioData(ab))

    tryPath(0);
  };
  loadOne(['./assets/pennywise_voiceoever.mp3','/assets/pennywise_voiceoever.mp3','/src/assets/pennywise_voiceoever.mp3'],b=>{pennyBuffer=b});
  loadOne(['./assets/saved.mp3','/assets/saved.mp3','/src/assets/saved.mp3'],b=>{savedBuffer=b});

function playPennywiseVoice(){

    voicePenny.currentTime=0;voicePenny.volume=1.0;

}
